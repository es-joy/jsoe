allowBuilds:
  core-js-bundle: true
  cypress: true
  es5-ext: true
  unrs-resolver: true

ignoredBuiltDependencies:
  - core-js-bundle
  - unrs-resolver

minimumReleaseAgeExclude:
  - jamilih@0.68.0
  - cypress@15.20.1
  - '@es-joy/jsdoccomment@0.95.0'
  - '@typescript-eslint/types@8.67.0'
  - eslint-config-ash-nazg@42.3.0
  - eslint-plugin-jsdoc@64.1.0
  - jsdoc-type-pratt-parser@9.1.1
  - zodexy@0.21.1 || 0.21.2 || 0.22.0 || 0.23.0 || 0.24.0
  - typeson-registry@13.0.1
  - typeson@10.1.1

onlyBuiltDependencies:
  - cypress
